services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sira
      POSTGRES_USER: sira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - sira_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sira -d sira"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Define APP_SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://sira:${POSTGRES_PASSWORD}@db:5432/sira
      CORS_ORIGINS: https://${SIRA_DOMAIN:?Define SIRA_DOMAIN}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Define BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Define BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrador SIRA}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ALLOW_LEGACY_DEVICE_KEY: "false"
      INGEST_API_KEY: ""
      SMS_PROVIDER: ${SMS_PROVIDER:-disabled}
      OPEN_METEO_BASE_URL: https://api.open-meteo.com/v1
      NASA_POWER_BASE_URL: https://power.larc.nasa.gov/api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      SIRA_DOMAIN: ${SIRA_DOMAIN:?Define SIRA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  sira_postgres:
  caddy_data:
  caddy_config:
